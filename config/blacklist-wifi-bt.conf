# Raspberry Pi 2 nie ma radia, ale obraz ma pozostać bez funkcji radiowych także po zmianie sprzętu.
blacklist brcmfmac
blacklist brcmutil
blacklist cfg80211
blacklist rfkill
blacklist bluetooth
blacklist btbcm
blacklist hci_uart
blacklist rfcomm
install brcmfmac /bin/false
install bluetooth /bin/false
